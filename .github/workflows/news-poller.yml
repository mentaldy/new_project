name: news-poller

on:
  schedule:
    # Every 15 min during KST market hours (09:00-15:30 KST = 00:00-06:30 UTC), Mon-Fri KST.
    - cron: "*/15 0-6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-poller
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore seen-news state
        uses: actions/cache@v4
        with:
          path: data/
          key: app-state-${{ github.run_id }}
          restore-keys: |
            app-state-

      - name: Run news poller
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python -m src.news_poller

      - name: Persist seen-news state
        run: |
          git config user.name "kr-stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen_news.json || true
          git diff --cached --quiet || git commit -m "chore: news dedup state [skip ci]"
          git push || true
