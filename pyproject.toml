[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kr-stock-recommender"
version = "0.1.0"
description = "AI-powered Korean stock recommendation tool (internal, 2 users)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pykrx>=1.0.45",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["src*"]
